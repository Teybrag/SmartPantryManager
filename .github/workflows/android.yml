name: Build Smart Pantry Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartPantryManager_Advanced.zip'
      - 'premium-overrides/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project archive exists
        run: test -f SmartPantryManager_Advanced.zip

      - name: Extract Android project
        run: unzip -q SmartPantryManager_Advanced.zip -d .

      - name: Improve recipe coverage without losing saved pantry data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("SmartPantryManager/app/src/main/java/com/teybrag/smartpantry/DatabaseHelper.java")
          s = p.read_text()
          s = s.replace("private static final int DB_VERSION = 1;", "private static final int DB_VERSION = 2;")
          s = s.replace("        seedRecipes(db);", "        seedRecipes(db);\n        seedAdditionalRecipes(db);")
          start = s.index("@Override public void onUpgrade(")
          end = s.index("\n\n    public long addPantryItem", start)
          s = s[:start] + """@Override public void onUpgrade(SQLiteDatabase db, int oldVersion, int newVersion) {
              // Keep the user's pantry and existing recipes when upgrading.
              seedAdditionalRecipes(db);
          }""" + s[end:]
          marker = "    private static void seedRecipes(SQLiteDatabase db) {"
          addition = r"""
    private static void seedAdditionalRecipes(SQLiteDatabase db) {
        addRecipeIfMissing(db, "Egg and Tomato Scramble",
            "1. Beat the eggs. 2. Chop the tomato. 3. Cook together in a non-stick pan until the eggs are fully set.",
            new Object[][]{{"eggs",2,"pcs"},{"tomato",1,"pcs"}});
        addRecipeIfMissing(db, "Cheese and Tomato Toast",
            "1. Place cheese and sliced tomato on the bread. 2. Toast in a pan or sandwich press until warm and crisp.",
            new Object[][]{{"bread",2,"slices"},{"cheese",30,"g"},{"tomato",1,"pcs"}});
        addRecipeIfMissing(db, "Banana Egg Pancakes",
            "1. Mash one ripe banana. 2. Mix with beaten eggs. 3. Cook small portions in a lightly greased non-stick pan until set on both sides.",
            new Object[][]{{"banana",1,"pcs"},{"eggs",2,"pcs"}});
        addRecipeIfMissing(db, "Potato and Egg Skillet",
            "1. Dice and boil the potatoes until nearly tender. 2. Add beaten eggs to a non-stick pan with the potatoes. 3. Cook until the eggs are set.",
            new Object[][]{{"potatoes",2,"pcs"},{"eggs",2,"pcs"}});
        addRecipeIfMissing(db, "Tomato and Onion Salad",
            "1. Wash and chop the tomatoes and onion. 2. Mix together and serve fresh.",
            new Object[][]{{"tomatoes",2,"pcs"},{"onion",1,"pcs"}});
        addRecipeIfMissing(db, "Simple Tomato Garlic Pasta",
            "1. Boil the pasta. 2. Cook chopped tomatoes and garlic in a pan with a little water. 3. Mix with the drained pasta.",
            new Object[][]{{"pasta",200,"g"},{"tomatoes",2,"pcs"},{"garlic",2,"cloves"}});
        addRecipeIfMissing(db, "Banana Oats",
            "1. Put the oats in a bowl. 2. Add milk and sliced banana. 3. Serve warm or chilled.",
            new Object[][]{{"oats",50,"g"},{"banana",1,"pcs"},{"milk",100,"ml"}});
        addRecipeIfMissing(db, "Chicken and Potato Bowl",
            "1. Cut the chicken into small pieces and cook thoroughly. 2. Boil or roast the potatoes until tender. 3. Serve together.",
            new Object[][]{{"chicken",200,"g"},{"potatoes",2,"pcs"}});
        addRecipeIfMissing(db, "Apple Banana Fruit Bowl",
            "1. Wash the apple and banana. 2. Chop both fruits and serve together.",
            new Object[][]{{"apple",1,"pcs"},{"banana",1,"pcs"}});
        addRecipeIfMissing(db, "Spinach Egg Scramble",
            "1. Wash and chop the spinach. 2. Cook until wilted, add beaten eggs, and cook until set.",
            new Object[][]{{"spinach",50,"g"},{"eggs",2,"pcs"}});
        addRecipeIfMissing(db, "Cheese Omelette",
            "1. Beat the eggs. 2. Pour into a non-stick pan. 3. Add cheese and fold when the eggs are fully set.",
            new Object[][]{{"eggs",2,"pcs"},{"cheese",30,"g"}});
        addRecipeIfMissing(db, "Peanut Butter Toast",
            "1. Toast the bread. 2. Spread peanut butter over the toast and serve.",
            new Object[][]{{"bread",2,"slices"},{"peanut butter",20,"g"}});
        addRecipeIfMissing(db, "Rice and Egg Bowl",
            "1. Cook the rice according to its package instructions. 2. Scramble the eggs until fully cooked. 3. Serve together.",
            new Object[][]{{"rice",100,"g"},{"eggs",2,"pcs"}});
        addRecipeIfMissing(db, "Carrot Potato Mash",
            "1. Peel and chop the carrots and potatoes. 2. Boil until soft. 3. Mash together and serve.",
            new Object[][]{{"carrots",2,"pcs"},{"potatoes",2,"pcs"}});
    }

    private static void addRecipeIfMissing(SQLiteDatabase db, String name, String steps, Object[][] ingredients) {
        ContentValues rv = new ContentValues();
        rv.put("name", name);
        rv.put("steps", steps);
        long recipeId = db.insertWithOnConflict("recipes", null, rv, SQLiteDatabase.CONFLICT_IGNORE);
        if (recipeId == -1) return;
        for (Object[] ingredient : ingredients) {
            ContentValues iv = new ContentValues();
            iv.put("recipe_id", recipeId);
            iv.put("name", (String) ingredient[0]);
            iv.put("quantity", ((Number) ingredient[1]).doubleValue());
            iv.put("unit", (String) ingredient[2]);
            db.insert("recipe_ingredients", null, iv);
        }
    }

"""
          if marker not in s:
              raise SystemExit("Could not locate recipe seeding method")
          s = s.replace(marker, addition + marker)
          p.write_text(s)
          PY
      - name: Apply premium UI theme
        run: cp premium-overrides/Ui.java SmartPantryManager/app/src/main/java/com/teybrag/smartpantry/Ui.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Add real food photography assets
        run: |
          mkdir -p SmartPantryManager/app/src/main/res/drawable-nodpi
          curl -fL --retry 3 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=1200&auto=format&fit=crop&q=85' -o SmartPantryManager/app/src/main/res/drawable-nodpi/photo_ingredients.jpg
          curl -fL --retry 3 'https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=1200&auto=format&fit=crop&q=85' -o SmartPantryManager/app/src/main/res/drawable-nodpi/photo_recipe.jpg
          curl -fL --retry 3 'https://images.unsplash.com/photo-1547592180-85f173990554?w=1200&auto=format&fit=crop&q=85' -o SmartPantryManager/app/src/main/res/drawable-nodpi/photo_kitchen.jpg

      - name: Build debug APK
        working-directory: SmartPantryManager
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPantryManager-debug-apk
          path: SmartPantryManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
