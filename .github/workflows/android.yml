name: Build Smart Pantry Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project archive exists
        run: test -f SmartPantryManager_Advanced.zip

      - name: Extract Android project
        run: unzip -q SmartPantryManager_Advanced.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: SmartPantryManager
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPantryManager-debug-apk
          path: SmartPantryManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
